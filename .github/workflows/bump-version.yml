name: Bump version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    # Release commits are pushed with GITHUB_TOKEN, which never re-triggers workflows;
    # this guard is an extra safety net against loops.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The release commit and tag list the commits since the previous tag; the npm `version`
      # script syncs README.md so package.json, README, and the tag share one version.
      - name: Bump minor version, commit, and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          changes=$(git log --no-merges --invert-grep --grep='^chore(release):' --format='- %s (%h)' "${previous:+$previous..}HEAD")
          message="chore(release): v%s [skip ci]"
          if [ -n "$changes" ]; then message="$message"$'\n\n'"$changes"; fi
          npm version minor -m "$message"
          git push origin HEAD:main --follow-tags
