name: Bump version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    # Release commits are pushed with GITHUB_TOKEN, which never re-triggers workflows;
    # this guard is an extra safety net against loops.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump minor version, commit, and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          npm version minor -m "chore(release): v%s [skip ci]"
          git push origin HEAD:main --follow-tags
